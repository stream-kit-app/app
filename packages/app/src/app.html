<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link rel="preconnect" href="https://fonts.bunny.net" />
		<link
			href="https://fonts.bunny.net/css?family=outfit:500,600,700|plus-jakarta-sans:400,500,600,700&display=swap"
			rel="stylesheet"
		/>
		<title>Tauri + SvelteKit + Typescript App</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
		<div
			id="boot-splash"
			aria-hidden="true"
			style="
				position: fixed;
				inset: 0;
				z-index: 200;
				overflow: hidden;
				background: oklch(0.06 0.004 264);
			"
		>
			<div
				style="
					position: absolute;
					inset: -20%;
					background:
						radial-gradient(circle at 30% 35%, oklch(0.38 0.16 255 / 0.22), transparent 42%),
						radial-gradient(circle at 70% 65%, oklch(0.85 0.18 95 / 0.12), transparent 38%);
				"
			></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
