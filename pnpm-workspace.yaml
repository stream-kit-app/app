packages:
    - 'packages/*'
    - 'plugins/*'
    - 'integrations/*'
    - 'site'
    - 'site/pb'
    - 'docs-site'

onlyBuiltDependencies:
    - '@tailwindcss/oxide'
    - esbuild
    - workerd

# runed/bits-ui declare an optional peer on SvelteKit 2; keep a single Kit 3 in the tree.
overrides:
    '@sveltejs/kit': ^3.0.0

peerDependencyRules:
    allowedVersions:
        '@sveltejs/kit': '3'
