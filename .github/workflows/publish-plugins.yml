name: Publish Plugins

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish (e.g. v0.1.0-alpha.10)'
                required: false
                type: string
            plugin:
                description: 'Plugin key to publish (leave empty for all)'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: publish-plugins-${{ github.event.inputs.plugin || github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: true

env:
    RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
    publish:
        name: Publish plugin distributions
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_REF }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build:packages

            - name: Verify plugin publish token
              env:
                  GH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "::error::PLUGIN_PUBLISH_TOKEN is required. Create a PAT with contents:write on all stream-kit-app/plugin-* repositories and add it as a repository secret."
                    exit 1
                  fi

                  gh auth setup-git
                  gh auth status
                  LOGIN="$(gh api user --jq .login)"
                  CAN_PUSH="$(gh api repos/stream-kit-app/plugin-bot --jq .permissions.push)"

                  if [ "$CAN_PUSH" != "true" ]; then
                    echo "::error::GitHub account ${LOGIN} cannot push to stream-kit-app/plugin-bot. Grant contents:write on every stream-kit-app/plugin-* repository to this account."
                    exit 1
                  fi

                  echo "Verified publish access for ${LOGIN}"

            - name: Publish plugin distributions
              env:
                  PLUGIN_PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
                  GH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
              run: |
                  if [ -n "${{ github.event.inputs.plugin }}" ]; then
                    node scripts/publish-plugin-distribution.mjs --plugin "${{ github.event.inputs.plugin }}"
                  else
                    node scripts/publish-plugin-distribution.mjs --all
                  fi
