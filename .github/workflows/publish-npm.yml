name: Publish npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish (e.g. v0.1.0-alpha.10)'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: publish-npm-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: true

env:
    RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
    publish:
        name: Publish SDK packages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_REF }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build SDK packages
              run: pnpm --filter @stream-kit/core build && pnpm --filter @stream-kit/plugin build && pnpm --filter @stream-kit/ui build

            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: pnpm publish:npm
