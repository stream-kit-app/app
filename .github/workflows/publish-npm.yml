name: Publish npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: publish-npm-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    publish:
        name: Publish SDK packages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build SDK packages
              run: pnpm --filter @stream-kit/core build && pnpm --filter @stream-kit/plugin build

            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: pnpm publish:npm
