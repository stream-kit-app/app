name: Build Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to build (e.g. v0.1.0-alpha.1)'
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: build-release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: true

env:
    RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    # Match packages/app/.env.production (baked into the frontend at build time).
    PUBLIC_POCKETBASE_URL: https://api.stream-kit.app
    PUBLIC_SITE_URL: https://stream-kit.app

jobs:
    build-windows:
        name: Build Windows installers
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ env.RELEASE_TAG }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: packages/app/src-tauri

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build:packages

            - name: Build and upload Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: packages/app
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: Stream Kit ${{ env.RELEASE_TAG }}
                  releaseBody: 'See the assets to download and install this version.'
                  releaseDraft: true
                  prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
                  args: --target x86_64-pc-windows-msvc --bundles nsis,msi

    publish-microsoft-store:
        name: Build MSIX and publish to Microsoft Store
        needs: build-windows
        if: vars.MSSTORE_PUBLISH == 'true'
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ env.RELEASE_TAG }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: packages/app/src-tauri

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build:packages

            - name: Install msixbundle-cli
              run: cargo install msixbundle-cli

            - name: Build MSIX bundle
              run: pnpm --filter @stream-kit/app tauri:windows:build -- --arch x64 --runner pnpm

            - name: Upload MSIX to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  files: packages/app/src-tauri/target/msix/*.msixbundle
                  fail_on_unmatched_files: true

            - name: Configure Microsoft Store CLI
              uses: microsoft/microsoft-store-apppublisher@v1.1

            - name: Reconfigure store credentials
              shell: pwsh
              run: |
                  msstore reconfigure `
                    --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
                    --sellerId ${{ secrets.SELLER_ID }} `
                    --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
                    --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

            - name: Publish to Microsoft Store
              shell: pwsh
              run: |
                  $bundle = Get-ChildItem -Path "packages/app/src-tauri/target/msix" -Filter "*.msixbundle" | Select-Object -First 1
                  if (-not $bundle) {
                    throw "No MSIX bundle found in packages/app/src-tauri/target/msix"
                  }
                  msstore publish $bundle.FullName -id ${{ secrets.MSSTORE_PRODUCT_ID }}
