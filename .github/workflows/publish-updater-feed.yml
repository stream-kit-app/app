name: Publish updater feed

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: 'Published release tag to copy to the updater feed (e.g. v0.1.0-alpha.24)'
                required: true
                type: string

permissions:
    contents: write

env:
    RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
    publish-feed:
        name: Copy latest.json and installer to updater tag
        runs-on: ubuntu-latest
        if: (github.event.inputs.tag || github.event.release.tag_name) != 'updater' && startsWith(github.event.inputs.tag || github.event.release.tag_name, 'v')
        steps:
            - name: Download latest.json and installer from published release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release download "${{ env.RELEASE_TAG }}" \
                    --repo "${{ github.repository }}" \
                    --pattern latest.json \
                    --pattern '*_x64-setup.exe' \
                    --dir updater-feed
                  mv updater-feed/*_x64-setup.exe updater-feed/stream-kit-setup.exe

            - name: Ensure updater release exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view updater --repo "${{ github.repository }}" >/dev/null 2>&1; then
                    exit 0
                  fi
                  gh release create updater \
                    --repo "${{ github.repository }}" \
                    --title "Updater manifest" \
                    --notes "Static Tauri updater feed. Installers live on versioned releases; this tag hosts latest.json and a stable-named copy of the latest Windows installer." \
                    --latest=false

            - name: Upload latest.json and installer to updater tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload updater updater-feed/latest.json updater-feed/stream-kit-setup.exe \
                    --repo "${{ github.repository }}" \
                    --clobber
